<script id="pwa-runtime">
(()=>{
  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  let installPrompt=null;
  const button=document.getElementById("pwa-install");
  window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;button.style.display="block"});
  button.addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;button.style.display="none"});
  window.addEventListener("appinstalled",()=>{installPrompt=null;button.style.display="none"});
  const status=document.getElementById("pwa-status");
  const showStatus=text=>{status.textContent=text;status.style.display="block";clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>status.style.display="none",2600)};
  window.addEventListener("offline",()=>showStatus("Mode hors connexion"));
  window.addEventListener("online",()=>showStatus("Connexion rétablie"));
  const openShortcut=()=>{
    const target=location.hash.slice(1).toLowerCase();
    if(!target)return;
    let tries=0;
    const timer=setInterval(()=>{const item=[...document.querySelectorAll("button,a")].find(el=>el.textContent.trim().toLowerCase().includes(target));if(item){item.click();clearInterval(timer)}else if(++tries>20)clearInterval(timer)},150);
  };
  window.addEventListener("load",openShortcut);
})();
