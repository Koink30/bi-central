<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mise à jour PULSE</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}.card{max-width:520px;background:#121933;border:1px solid #29345f;border-radius:22px;padding:22px}h1{margin-top:0}p{color:#b9c4e5;line-height:1.5}button{width:100%;padding:14px;border:0;border-radius:14px;background:#7667ff;color:#fff;font-weight:800;font-size:16px}</style></head><body><div class="card"><h1>Mise à jour PULSE</h1><p id="status">Nettoyage de l’ancienne version…</p><button id="go">Ouvrir PULSE à jour</button></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/pulse/'))await r.unregister();}}if('caches'in window){const keys=await caches.keys();for(const k of keys){if(k.startsWith('pulse-'))await caches.delete(k);}}document.getElementById('status').textContent='Ancien cache supprimé. Tu peux ouvrir la nouvelle version.';}catch(e){document.getElementById('status').textContent='Nettoyage partiel effectué. Ouvre PULSE puis recharge si nécessaire.';}document.getElementById('go').onclick=()=>location.replace('./?v=3-'+Date.now());})();</script></body></html>
